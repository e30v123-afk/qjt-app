<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قافلة الجزيرة</title>
<style>
  :root { --brand:#e8912a; --bg:#101418; --ink:#eef2f6; --ink-2:#98a2ad; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:32px;
    text-align:center; font:16px/1.7 -apple-system,"SF Pro Text",system-ui,"Segoe UI",sans-serif;
  }
  .mark { width:96px; height:96px; }
  h1 { margin:4px 0 0; font-size:21px; font-weight:800; letter-spacing:-.2px; }
  p { margin:0; color:var(--ink-2); font-size:14.5px; max-width:310px; }
  button {
    margin-top:8px; background:var(--brand); color:#10140f; border:0; border-radius:13px;
    padding:13px 34px; font:700 15.5px inherit; cursor:pointer;
  }
  button:active { transform:scale(.97); }
  .hint { position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); font-size:12.5px; color:#5d6670; }
</style>
</head>
<body>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 2.5s6.5 7.2 6.5 11.4A6.5 6.5 0 0 1 12 20.5a6.5 6.5 0 0 1-6.5-6.6C5.5 9.7 12 2.5 12 2.5z"/>
    <path d="M10 14.5a3 3 0 0 0 3 3"/>
  </svg>
  <h1>قافلة الجزيرة</h1>
  <p>تعذّر الوصول إلى المتجر. تأكد من اتصالك بالإنترنت ثم أعد المحاولة.</p>
  <button type="button" onclick="location.replace('https://qjt.sa/')">إعادة المحاولة</button>
  <div class="hint">شركة قافلة الجزيرة التجارية</div>
<script>
  // لو عاد الاتصال، ادخل المتجر تلقائياً
  addEventListener('online', function () { location.replace('https://qjt.sa/'); });
  setTimeout(function () { if (navigator.onLine) location.replace('https://qjt.sa/'); }, 2500);
</script>
</body>
</html>
